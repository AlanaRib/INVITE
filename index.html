
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta name="theme-color" content="#0b0b0d">

    <meta
        name="description"
        content="Convite de aniversário da Alana."
    >

    <title>Convite</title>

    <!-- Favicon -->

    <link
        rel="icon"
        type="image/svg+xml"
        href="/INVITE/IMGS/favicon.svg"
    >

    <!-- CSS -->

    <link rel="stylesheet" href="CSS/style.css">

    <!-- JavaScript -->

    <script src="JS/app.js" defer></script>

</head>

<body>

    <!-- =========================================
         ABERTURA DO CONVITE
    ========================================== -->

    <section
        class="intro"
        id="intro"
        aria-label="Abertura do convite"
    >

        <div
            class="intro__atmosphere"
            aria-hidden="true"
        >

            <!-- =================================
                 MOLDURA 02 POLIDA
                 Construída com HTML + CSS
            ================================== -->

            <div class="intro__frame">

                <!-- Linhas estruturais -->

                <i class="rail top"></i>
                <i class="rail right"></i>
                <i class="rail bottom"></i>
                <i class="rail left"></i>

                <!-- Canto superior esquerdo -->

                <div class="corner tl">
                    <i class="piece c1"></i>
                    <i class="piece c2"></i>
                    <i class="piece c3"></i>
                    <i class="piece c4"></i>
                    <i class="piece c5"></i>
                    <i class="piece c6"></i>
                    <i class="piece c7"></i>
                </div>

                <!-- Canto superior direito -->

                <div class="corner tr">
                    <i class="piece c1"></i>
                    <i class="piece c2"></i>
                    <i class="piece c3"></i>
                    <i class="piece c4"></i>
                    <i class="piece c5"></i>
                    <i class="piece c6"></i>
                    <i class="piece c7"></i>
                </div>

                <!-- Canto inferior esquerdo -->

                <div class="corner bl">
                    <i class="piece c1"></i>
                    <i class="piece c2"></i>
                    <i class="piece c3"></i>
                    <i class="piece c4"></i>
                    <i class="piece c5"></i>
                    <i class="piece c6"></i>
                    <i class="piece c7"></i>
                </div>

                <!-- Canto inferior direito -->

                <div class="corner br">
                    <i class="piece c1"></i>
                    <i class="piece c2"></i>
                    <i class="piece c3"></i>
                    <i class="piece c4"></i>
                    <i class="piece c5"></i>
                    <i class="piece c6"></i>
                    <i class="piece c7"></i>
                </div>

                <!-- Ornamentos centrais -->

                <div class="mid top"></div>
                <div class="mid bottom"></div>

                <div class="side left"></div>
                <div class="side right"></div>

            </div>

            <!-- Camadas atmosféricas -->

            <div class="intro__glow intro__glow--red"></div>
            <div class="intro__glow intro__glow--silver"></div>

        </div>

        <!-- =====================================
             PERSONAGEM DECORATIVO
        ====================================== -->

        <div
            class="intro__character"
            data-art="intro-character"
            aria-hidden="true"
        ></div>

        <!-- =====================================
             ENVELOPE
        ====================================== -->

        <div class="intro__content">

            <button
                class="envelope"
                id="open-envelope"
                type="button"
                aria-label="Abrir o convite"
                aria-controls="invitation"
            >

                <!-- Sombra -->

                <span
                    class="envelope__shadow"
                    aria-hidden="true"
                ></span>

                <!-- Corpo vermelho com ornamentação -->

                <span
                    class="envelope__body"
                    aria-hidden="true"
                ></span>

                <!-- Aba triangular -->

                <span
                    class="envelope__flap"
                    aria-hidden="true"
                ></span>

                <!-- Carta interna -->

                <span
                    class="envelope__letter"
                    aria-hidden="true"
                ></span>

                <!-- =================================
                     SELO DE CERA RITUALÍSTICO
                     COM SIGILO DE SANGUE
                ================================== -->

                <span
                    class="envelope__seal"
                    aria-hidden="true"
                >

                    <span class="envelope__seal-core">

                        <img
                            class="envelope__seal-sigil"
                            src="IMGS/sangue-sigil.svg"
                            alt=""
                            draggable="false"
                        >

                    </span>

                </span>

                <!-- Texto do envelope -->

                <span class="envelope__label">
                    VOCÊ ESTÁ CONVIDADO
                </span>

            </button>

        </div>

        <!-- =====================================
             PARTÍCULAS DE ABERTURA
        ====================================== -->

        <div
            class="particles"
            id="particles"
            aria-hidden="true"
        ></div>

    </section>

    <!-- =========================================
         PÁGINA PRINCIPAL DO CONVITE
    ========================================== -->

    <main
        class="invitation"
        id="invitation"
        aria-label="Convite de aniversário"
        hidden
    >

        <!-- =====================================
             CABEÇALHO
        ====================================== -->

        <header class="masthead">

            <span class="masthead__edition">
                ALANA
            </span>

            <span
                class="masthead__divider"
                aria-hidden="true"
            ></span>

            <span class="masthead__occasion">
                19 ANOS
            </span>

        </header>

        <!-- =====================================
             APRESENTAÇÃO
        ====================================== -->

        <section
            class="hero"
            id="inicio"
            aria-labelledby="hero-title"
        >

            <!-- Personagens decorativos -->

            <div
                class="hero__character hero__character--one"
                data-art="hero-character-one"
                aria-hidden="true"
            ></div>

            <div
                class="hero__character hero__character--two"
                data-art="hero-character-two"
                aria-hidden="true"
            ></div>

            <div
                class="hero__character hero__character--three"
                data-art="hero-character-three"
                aria-hidden="true"
            ></div>

            <div class="hero__copy">

                <p class="hero__subtitle">
                    Pro meu aniversário.
                </p>

                <h1
                    class="hero__title"
                    id="hero-title"
                >
                    Alana
                    <span>faz 19!</span>
                </h1>

            </div>

            <span
                class="hero__ornament"
                aria-hidden="true"
            ></span>

        </section>

        <!-- =====================================
             INFORMAÇÕES DO ANIVERSÁRIO
        ====================================== -->

        <section
            class="details"
            id="detalhes"
            aria-label="Informações do aniversário"
        >

            <div
                class="details__character details__character--one"
                data-art="details-character-one"
                aria-hidden="true"
            ></div>

            <div class="details__grid">

                <!-- Data -->

                <article class="detail detail--date">

                    <span class="detail__label">
                        DATA
                    </span>

                    <p class="detail__value">
                        08/11/2026
                    </p>

                </article>

                <!-- Horário -->

                <article class="detail detail--time">

                    <span class="detail__label">
                        HORÁRIO
                    </span>

                    <p class="detail__value">
                        A partir das 11h30
                    </p>

                </article>

                <!-- Local -->

                <article class="detail detail--location">

                    <span class="detail__label">
                        LOCAL
                    </span>

                    <p class="detail__value">
                        R. Diva Regnier Barrozo, 116
                        <span>Curitiba — PR</span>
                    </p>

                </article>

            </div>

            <div
                class="details__character details__character--two"
                data-art="details-character-two"
                aria-hidden="true"
            ></div>

        </section>

        <!-- =====================================
             CARDÁPIO
        ====================================== -->

        <section
            class="menu"
            id="cardapio"
            aria-labelledby="menu-title"
        >

            <div
                class="menu__character menu__character--one"
                data-art="menu-character-one"
                aria-hidden="true"
            ></div>

            <h2
                class="menu__title"
                id="menu-title"
            >
                Cardápio
            </h2>

            <!-- Conteúdo configurável -->

            <div class="menu__content">

                <div
                    class="menu__items"
                    id="menu-items"
                ></div>

            </div>

            <!-- Observação sobre bebidas -->

            <aside class="menu__notice">

                <p>
                    Cada convidado deve levar sua própria
                    bebida alcoólica.
                </p>

            </aside>

            <div
                class="menu__character menu__character--two"
                data-art="menu-character-two"
                aria-hidden="true"
            ></div>

        </section>

        <!-- =====================================
             CONFIRMAÇÃO DE PRESENÇA
        ====================================== -->

        <section
            class="rsvp"
            id="confirmacao"
            aria-labelledby="rsvp-title"
        >

            <div
                class="rsvp__character rsvp__character--one"
                data-art="rsvp-character-one"
                aria-hidden="true"
            ></div>

            <h2
                class="rsvp__title"
                id="rsvp-title"
            >
                Confirmação de presença
            </h2>

            <div class="rsvp__card">

                <form
                    class="rsvp__form"
                    id="rsvp-form"
                >

                    <!-- Nome -->

                    <div class="form-field">

                        <label for="guest-name">
                            Nome
                        </label>

                        <input
                            type="text"
                            id="guest-name"
                            name="nome"
                            placeholder="Seu nome"
                            autocomplete="name"
                            maxlength="100"
                            required
                        >

                    </div>

                    <!-- Presença -->

                    <fieldset
                        class="form-field form-field--attendance"
                    >

                        <legend>
                            Você poderá comparecer?
                        </legend>

                        <div class="attendance-options">

                            <label class="attendance-option">

                                <input
                                    type="radio"
                                    name="presenca"
                                    value="Sim"
                                    required
                                >

                                <span class="attendance-option__content">
                                    Sim
                                </span>

                            </label>

                            <label class="attendance-option">

                                <input
                                    type="radio"
                                    name="presenca"
                                    value="Não"
                                    required
                                >

                                <span class="attendance-option__content">
                                    Não
                                </span>

                            </label>

                        </div>

                    </fieldset>

                    <!-- Acompanhantes -->

                    <div
                        class="form-field"
                        id="companions-field"
                    >

                        <label for="companions">
                            Quantos acompanhantes você levará?
                        </label>

                        <input
                            type="number"
                            id="companions"
                            name="acompanhantes"
                            min="0"
                            max="4"
                            step="1"
                            inputmode="numeric"
                            placeholder="De 0 a 4"
                            disabled
                        >

                    </div>

                    <!-- Enviar -->

                    <button
                        class="rsvp__submit"
                        id="rsvp-submit"
                        type="submit"
                    >
                        Enviar resposta
                    </button>

                    <!-- Feedback -->

                    <p
                        class="rsvp__feedback"
                        id="rsvp-feedback"
                        role="status"
                        aria-live="polite"
                    ></p>

                </form>

            </div>

            <div
                class="rsvp__character rsvp__character--two"
                data-art="rsvp-character-two"
                aria-hidden="true"
            ></div>

        </section>

    </main>

</body>
</html>
